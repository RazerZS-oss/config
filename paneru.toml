# ==============================================================================
# ⚡ Paneru Configuration (Pure Keyboard-Driven - No Trackpad Interference!)
# ==============================================================================

[options]
focus_follows_mouse = true
mouse_follows_focus = true
preset_column_widths = [0.33, 0.5, 0.66, 1.0]
animation_speed = 15.0
sliver_width = 5
sliver_height = 1.0

[padding]
top = 6
bottom = 6
left = 6
right = 6

# ------------------------------------------------------------------------------
# ALL 2-KEY SHORTCUTS (Option + Key):
# Pure keyboard navigation for maximum speed and zero trackpad annoyance!
# ------------------------------------------------------------------------------
[bindings]
# Focus Navigation
window_focus_west = "alt - h"
window_focus_east = "alt - l"

# Move / Swap Windows
window_swap_west = "alt - j"
window_swap_east = "alt - k"

# Resize Width
window_resize = "alt - r"

# Toggle Full-Width Window (Niri-style fullscreen on ribbon!)
window_fullwidth = "alt - f"

# Center Window
window_center = "alt - c"

# Quit Daemon
quit = "alt - q"

# ------------------------------------------------------------------------------
# Floating Rules
# ------------------------------------------------------------------------------
[windows.finder]
bundle_id = "com.apple.finder"
title = ".*"
manage = false

[windows.settings]
bundle_id = "com.apple.systempreferences"
title = ".*"
manage = false

[windows.whatsapp]
bundle_id = "net.whatsapp.WhatsApp"
title = ".*"
manage = false

[windows.orbstack]
bundle_id = "dev.kdrag0n.MacVirt"
title = ".*"
manage = false
